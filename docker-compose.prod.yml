name: skillpath-prod

services:
  db:
    image: postgres:16
    container_name: skillpath_db_prod
    restart: "no"
    environment:
      POSTGRES_USER: skillpath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillpath}
      POSTGRES_DB: skillpath
    ports:
      - "5433:5432"
    volumes:
      - skillpath_pgdata_prod:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillpath -d skillpath"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: skillpath_backend_prod
    restart: "no"
    environment:
      DATABASE_URL: postgresql://skillpath:${POSTGRES_PASSWORD:-skillpath}@db:5432/skillpath
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8001
    container_name: skillpath_frontend_prod
    restart: "no"
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  skillpath_pgdata_prod:
