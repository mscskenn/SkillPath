services:
  db:
    image: postgres:16
    container_name: skillpath_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: skillpath
      POSTGRES_PASSWORD: skillpath
      POSTGRES_DB: skillpath
    ports:
      - "5432:5432"
    volumes:
      - skillpath_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillpath -d skillpath"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  skillpath_pgdata:
